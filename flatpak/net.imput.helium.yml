app-id: net.imput.helium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: helium-flatpak
default-branch: stable

finish-args:
  # Required for flatpak-spawn --host. Helium itself runs outside this sandbox.
  - --talk-name=org.freedesktop.Flatpak

modules:
  # Helium runs these commands on the host for web app shortcuts, default apps,
  # and opening links, and some hosts, such as GNOME OS, do not include them.
  - name: xdg-utils
    buildsystem: simple
    build-commands:
      - |
        cd scripts
        for script in xdg-desktop-menu xdg-icon-resource xdg-settings xdg-mime xdg-email xdg-open; do
          # The upstream Makefile needs xmlto only to embed help text.
          touch "$script.txt"
          awk -f generate-help-script.awk "$script.in" | sed "s/@NAME@/$script/g" > "$script"
          sh -n "$script"
          install -Dm755 "$script" "/app/libexec/xdg-utils/$script"
        done
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/xdg/xdg-utils/-/archive/v1.2.1/xdg-utils-v1.2.1.tar.gz
        sha256: f6b648c064464c2636884c05746e80428110a576f8daacf46ef2e554dcfdae75

  - name: helium
    buildsystem: simple
    build-commands:
      - mkdir -p /app/helium
      - cp -a helium-*_linux/. /app/helium/
      - install -Dm755 helium-flatpak /app/bin/helium-flatpak
      - install -Dm755 helium-host /app/libexec/helium-host
      - install -Dm644 /app/helium/helium.desktop /app/share/applications/net.imput.helium.desktop
      # Keep upstream translations and actions, routing every Exec through our launcher.
      - sed -i -E 's/^Exec=helium([[:space:]]|$)/Exec=helium-flatpak\1/' /app/share/applications/net.imput.helium.desktop
      # The browser runs on the host, so it cannot complete Flatpak's startup notification.
      - sed -i 's/^StartupNotify=true$/StartupNotify=false/' /app/share/applications/net.imput.helium.desktop
      - desktop-file-edit --set-icon=net.imput.helium /app/share/applications/net.imput.helium.desktop
      - install -Dm644 net.imput.helium.metainfo.xml /app/share/metainfo/net.imput.helium.metainfo.xml
      - install -Dm644 /app/helium/product_logo_256.png /app/share/icons/hicolor/256x256/apps/net.imput.helium.png
      # helium-host mirrors this upstream launcher. If this fails, compare the
      # new helium-wrapper with helium-host, then update this checksum.
      - echo "cf6e652dc9f9c6e224f45a23c7e4dd84b0693208d63ee47a9f87ccee2748a5f2  helium-wrapper" |
        (cd helium-*_linux && sha256sum --check --quiet)
      - sh -n /app/bin/helium-flatpak /app/libexec/helium-host
      - desktop-file-validate /app/share/applications/net.imput.helium.desktop
    sources:
      - type: archive
        url: https://github.com/imputnet/helium-linux/releases/download/0.21.2.1/helium-0.21.2.1-x86_64_linux.tar.xz
        sha256: e55c253e082f78fb5ae094ca465a59e06882fd7c87ebf383165beb3560e0b519
        strip-components: 0
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/imputnet/helium-linux/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: .assets[] | select(.name == "helium-" + $version + "-x86_64_linux.tar.xz")
            | .browser_download_url
          is-main-source: true
          release-url-template: https://github.com/imputnet/helium-linux/releases/tag/$version
      - type: archive
        url: https://github.com/imputnet/helium-linux/releases/download/0.21.2.1/helium-0.21.2.1-arm64_linux.tar.xz
        sha256: 720b90b55c190c25069d2443f121a0c3c4fee705564060d7b8d3f219aa9e1ef0
        strip-components: 0
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/imputnet/helium-linux/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: .assets[] | select(.name == "helium-" + $version + "-arm64_linux.tar.xz")
            | .browser_download_url
      - type: file
        path: package/helium-flatpak
      - type: file
        path: package/helium-host
      - type: file
        path: net.imput.helium.metainfo.xml
